name: Release

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source commit or branch (defaults to the repository's default branch)
        required: false
        type: string
      version:
        description: Version used for the tag and release name (e.g. v1.0.0)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source || github.event.repository.default_branch }}

      - name: Validate release version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Version must use the format vX.Y.Z (e.g. v1.0.0).'
            exit 1
          fi
          existing_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION")
          if [[ -n "$existing_tag" ]]; then
            echo "::error::Tag $RELEASE_VERSION already exists."
            exit 1
          fi

      - name: Set package version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          manifest.version = process.env.RELEASE_VERSION.slice(1);
          writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Set up project
        uses: ./.github/actions/setup

      - name: Package extension
        run: pnpm ext:package --out "universal-chat-provider-$RELEASE_VERSION.vsix"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_VERSION" \
            "universal-chat-provider-$RELEASE_VERSION.vsix" \
            --target "$(git rev-parse HEAD)" \
            --title "$RELEASE_VERSION" \
            --generate-notes
